# ABOUTME: Workflow that releases Chug: bumps versions, updates changelog, builds, and publishes.
# ABOUTME: Triggered manually via workflow_dispatch with a version string and publish target.

name: Release Chug

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 0.1.0
        required: true
      publish-target:
        description: Package index to publish to
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      PUBLISH_TARGET: ${{ inputs.publish-target }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "This workflow must be run from the main branch."
            exit 1
          fi

          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)?$ ]]; then
            echo "Version must look like 1.2.3 or 1.2.3-rc1."
            exit 1
          fi

          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists."
            exit 1
          fi

      - name: Update version in package files
        shell: bash
        run: |
          sed -i "s/^version = \".*\"$/version = \"${VERSION}\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"$/__version__ = \"${VERSION}\"/" cli/src/chug/__init__.py
          grep -q "^version = \"${VERSION}\"$" pyproject.toml
          grep -q "^__version__ = \"${VERSION}\"$" cli/src/chug/__init__.py

      - name: Set up Chug
        uses: ./
        with:
          source: repo

      - name: Run tests
        shell: bash
        run: |
          uv run --group dev pytest

      - name: Run chug release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: chug release --version "${{ inputs.version }}"

      - name: Create local release commit and tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml cli/src/chug/__init__.py CHANGELOG.md
          git add -A changes/ || true
          git commit -m "Release ${VERSION}"
          git tag -a "${VERSION}" -m "Release ${VERSION}"

      - name: Embed build commit metadata
        shell: bash
        run: |
          printf '%s\n' '# ABOUTME: Build metadata for the published Chug package.' > cli/src/chug/_build.py
          printf '%s\n' '# ABOUTME: The release process may overwrite this file to embed a commit hash in artifacts.' >> cli/src/chug/_build.py
          printf '\n__commit__ = "%s"\n' "$(git rev-parse --short HEAD)" >> cli/src/chug/_build.py

      - name: Smoke check version output
        shell: bash
        run: |
          chug --version

      - name: Build package
        shell: bash
        run: |
          rm -rf dist
          uv build

      - name: Check package metadata
        shell: bash
        run: |
          uvx twine check dist/*

      - name: Publish to TestPyPI
        if: env.PUBLISH_TARGET == 'testpypi'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        shell: bash
        run: |
          uv publish --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/ dist/*

      - name: Publish to PyPI
        if: env.PUBLISH_TARGET == 'pypi'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        shell: bash
        run: |
          uv publish dist/*

      - name: Push release commit
        if: env.PUBLISH_TARGET == 'pypi'
        shell: bash
        run: |
          git push
          git push origin "${VERSION}"

      - name: Create GitHub release
        if: env.PUBLISH_TARGET == 'pypi'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${VERSION}" --title "${VERSION}" --generate-notes
