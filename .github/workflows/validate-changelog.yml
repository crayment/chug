# ABOUTME: Workflow that validates each PR includes a Chug change file.
# ABOUTME: Runs chug validate using the CLI installed from the current branch.

name: Changelog

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Chug
        uses: ./
        with:
          source: repo

      - name: Validate changelog entry
        shell: bash
        run: chug validate
