name: Changelog

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changelog entry
        # Third-party repos should reference the published action, for example:
        # uses: crayment/chug/.github/actions/chug-validate@v1
        uses: ./.github/actions/chug-validate
