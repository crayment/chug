[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chug-cli"
version = "0.1.1"
description = "Agent-first changelog management for teams"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Cody Rayment", email = "crayment16@gmail.com" },
]
keywords = ["changelog", "release-notes", "cli", "agents", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Topic :: Software Development :: Version Control",
]
dependencies = [
  "click>=8.1.0",
  "PyYAML>=6.0",
  "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/crayment/chug"
Repository = "https://github.com/crayment/chug"
Issues = "https://github.com/crayment/chug/issues"
Changelog = "https://github.com/crayment/chug/blob/main/README.md"

[project.scripts]
chug = "chug.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cli/src/chug"]

[tool.pytest.ini_options]
testpaths = ["cli/tests"]

[tool.ruff]
target-version = "py311"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.11.0",
]
